<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">


<!-- Warm glow from open door -->
<ellipse cx="388" cy="350" rx="90" ry="22" fill="#E8993C" opacity="0.08"/>
<rect x="355" y="248" width="55" height="96" fill="#F5D090" opacity="0.14" rx="1"/>

<!-- LEFT WALL as tokens -->
<g font-family="'Courier New', monospace" fill="#6B3520" font-size="11" opacity="0.55">
<text x="204" y="178">open</text>
<text x="204" y="198">to</text>
<text x="204" y="218">every</text>
<text x="204" y="238">##one</text>
<text x="204" y="258">figur</text>
<text x="204" y="278">##ing</text>
<text x="204" y="298">this</text>
<text x="204" y="318">out</text>
<text x="204" y="338">together</text>
</g>

<!-- SHED FRAME — no left wall line -->
<g stroke="#6B3520" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- Roof -->
<path d="M340 50 L208 160 L472 160 Z" stroke-width="2.8"/>
<!-- Right wall -->
<line x1="472" y1="160" x2="472" y2="345" stroke-width="2.8"/>
<!-- Floor -->
<line x1="208" y1="345" x2="472" y2="345" stroke-width="2.8"/>
<!-- Window -->
<rect x="250" y="199" width="64" height="50" rx="2" stroke-width="1.8"/>
<line x1="282" y1="199" x2="282" y2="249" stroke-width="1.2"/>
<line x1="250" y1="224" x2="314" y2="224" stroke-width="1.2"/>
<!-- Open door -->
<line x1="350" y1="245" x2="350" y2="345" stroke-width="1.8"/>
<line x1="350" y1="245" x2="413" y2="245" stroke-width="1.8"/>
<line x1="413" y1="245" x2="430" y2="260" stroke-width="1.5"/>
<line x1="430" y1="260" x2="430" y2="345" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.5"/>
<line x1="350" y1="245" x2="335" y2="258" stroke-width="1.5" opacity="0.6"/>
<line x1="335" y1="258" x2="335" y2="345" stroke-width="1.5" opacity="0.5"/>
</g>

<!-- Door handle -->
<circle cx="339" cy="298" r="3" fill="#D4793A"/>

<!-- Accent dots -->
<circle cx="340" cy="50" r="6" fill="#D4793A"/>
<circle cx="208" cy="160" r="5" fill="#D4793A"/>
<circle cx="472" cy="160" r="5" fill="#D4793A"/>
<circle cx="208" cy="345" r="5" fill="#D4793A"/>
<circle cx="472" cy="345" r="5" fill="#D4793A"/>


</svg>
